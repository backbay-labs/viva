name: Validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: No-secret validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Continuous redaction control gate
        env:
          VIVA_REDACTION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: bun run redaction:check

      - name: Validate TypeScript, Rust, and purity gates
        env:
          VIVA_AGENT_PROVIDER: synthetic
        run: bun run validate

      - name: Direct WebSocket replay gate
        env:
          VIVA_AGENT_PROVIDER: fake_cartesia_gemini
        run: bun run agent:replay:ws

      - name: Install browser for E2E gate
        run: bunx playwright install --with-deps chromium

      - name: Browser synthetic manuscript E2E gate
        env:
          VIVA_E2E_AGENT_PROVIDER: synthetic
          VIVA_E2E_REQUIRE_POST_ANSWER_SOURCE_FOLIO: "1"
        run: bun run e2e:browser

      - name: Sanitized release evidence gate
        env:
          VIVA_AGENT_PROVIDER: fake_cartesia_gemini
          VIVA_RELEASE_CHECK_SKIP_BROWSER: "1"
        run: bun run release:check

      - name: Upload sanitized release evidence bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: viva-release-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/release-check/evidence.json
            artifacts/release-check/*.stdout.log
            artifacts/release-check/*.stderr.log
            artifacts/e2e-browser/browser-story.json
            artifacts/e2e-browser/result.json
            artifacts/e2e-browser/*.png
            artifacts/e2e-browser/*.log

  durable:
    name: Opt-in durable Postgres proof
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: viva_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: Run durable replay and parity tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/viva_test
          VIVA_ALLOW_LOOPBACK_TEST_SKIP: "1"
          VIVA_AGENT_PROVIDER: synthetic
        run: |
          cargo test --manifest-path agent/Cargo.toml -p data optional_postgres -- --nocapture
          cargo test --manifest-path agent/Cargo.toml -p agent-service --test voice_ws optional_postgres -- --nocapture
