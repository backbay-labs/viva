<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Life of a study turn: the learner speaks, audio streams over the WebSocket, the agent transcribes, evaluates the answer, retrieves a grounding source, issues a correction, marks concept mastery, and schedules the review">
  <title>Life of a study turn</title>
  <defs>
    <linearGradient id="lcCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfbf6"/>
      <stop offset="100%" stop-color="#faf7f1"/>
    </linearGradient>
    <g id="lcArrow"><path d="M -6 -5 L 6 0 L -6 5 L -3 0 Z" fill="#7a5ba6" opacity="0.8"/></g>
  </defs>

  <rect width="900" height="420" fill="#f4efe6"/>

  <g font-family="'Hanken Grotesk', 'Avenir Next', Helvetica, Arial, sans-serif" font-size="10.5">
    <rect x="25" y="33" width="11" height="11" rx="3" fill="#e9eee4" stroke="#7f9277" stroke-width="1"/>
    <text x="43" y="42.5" fill="#5d5670">browser</text>
    <rect x="110" y="33" width="11" height="11" rx="3" fill="#efe7f6" stroke="#a98fce" stroke-width="1"/>
    <text x="128" y="42.5" fill="#5d5670">agent · Rust</text>
    <text x="875" y="42.5" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#938aa4">voice protocol v5 · 24 kHz pcm_s16le</text>
  </g>

  <use href="#lcArrow" transform="translate(230 119)"/>
  <use href="#lcArrow" transform="translate(450 119)"/>
  <use href="#lcArrow" transform="translate(670 119)"/>

  <path d="M 875 119 H 884 Q 892 119 892 128 V 288 Q 892 297 883 297 H 881"
        fill="none" stroke="#7a5ba6" stroke-width="1.4" opacity="0.55" stroke-linecap="round"/>
  <use href="#lcArrow" transform="translate(874 297) rotate(180)"/>

  <use href="#lcArrow" transform="translate(670 297) rotate(180)"/>
  <use href="#lcArrow" transform="translate(450 297) rotate(180)"/>
  <use href="#lcArrow" transform="translate(230 297) rotate(180)"/>

  <!-- Row 1 -->
  <g transform="translate(25 72)">
    <rect width="190" height="94" rx="16" fill="url(#lcCard)" stroke="#7f9277" stroke-width="1.25"/>
    <circle cx="26" cy="27" r="13" fill="#e9eee4" stroke="#7f9277" stroke-width="1"/>
    <text x="26" y="31.5" text-anchor="middle" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#4f6247">1</text>
    <text x="48" y="33" font-family="Cormorant, Georgia, serif" font-size="22" font-weight="600" fill="#2c2536">Speak</text>
    <text x="20" y="60" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="10.5" fill="#5d5670">Close the notes and answer</text>
    <text x="20" y="77" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="10.5" fill="#5d5670">out loud, from memory.</text>
  </g>

  <g transform="translate(245 72)">
    <rect width="190" height="94" rx="16" fill="url(#lcCard)" stroke="#7f9277" stroke-width="1.25"/>
    <circle cx="26" cy="27" r="13" fill="#e9eee4" stroke="#7f9277" stroke-width="1"/>
    <text x="26" y="31.5" text-anchor="middle" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#4f6247">2</text>
    <text x="48" y="33" font-family="Cormorant, Georgia, serif" font-size="22" font-weight="600" fill="#2c2536">Stream</text>
    <text x="20" y="60" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="10.5" fill="#5d5670">PCM frames cross the socket.</text>
    <text x="20" y="78" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#7a5ba6">audio · text · cancel</text>
  </g>

  <g transform="translate(465 72)">
    <rect width="190" height="94" rx="16" fill="url(#lcCard)" stroke="#a98fce" stroke-width="1.25"/>
    <circle cx="26" cy="27" r="13" fill="#efe7f6" stroke="#a98fce" stroke-width="1"/>
    <text x="26" y="31.5" text-anchor="middle" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#553b78">3</text>
    <text x="48" y="33" font-family="Cormorant, Georgia, serif" font-size="22" font-weight="600" fill="#2c2536">Transcribe</text>
    <text x="20" y="60" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="10.5" fill="#5d5670">Partials stream during the answer.</text>
    <text x="20" y="78" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#7a5ba6">transcript_delta → final</text>
  </g>

  <g transform="translate(685 72)">
    <rect width="190" height="94" rx="16" fill="url(#lcCard)" stroke="#a98fce" stroke-width="1.25"/>
    <circle cx="26" cy="27" r="13" fill="#efe7f6" stroke="#a98fce" stroke-width="1"/>
    <text x="26" y="31.5" text-anchor="middle" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#553b78">4</text>
    <text x="48" y="33" font-family="Cormorant, Georgia, serif" font-size="22" font-weight="600" fill="#2c2536">Evaluate</text>
    <text x="20" y="60" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="10.5" fill="#5d5670">Does the explanation hold?</text>
    <text x="20" y="78" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#7a5ba6">evaluate_spoken_answer</text>
  </g>

  <!-- Row 2, right to left -->
  <g transform="translate(685 250)">
    <rect width="190" height="94" rx="16" fill="url(#lcCard)" stroke="#a98fce" stroke-width="1.25"/>
    <circle cx="26" cy="27" r="13" fill="#efe7f6" stroke="#a98fce" stroke-width="1"/>
    <text x="26" y="31.5" text-anchor="middle" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#553b78">5</text>
    <text x="48" y="33" font-family="Cormorant, Georgia, serif" font-size="22" font-weight="600" fill="#2c2536">Ground</text>
    <text x="20" y="60" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="10.5" fill="#5d5670">Pull the passage that settles it.</text>
    <text x="20" y="78" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#7a5ba6">retrieve_source_reference</text>
  </g>

  <g transform="translate(465 250)">
    <rect width="190" height="94" rx="16" fill="url(#lcCard)" stroke="#bd9a55" stroke-width="1.5"/>
    <circle cx="26" cy="27" r="13" fill="#f3ebd8" stroke="#bd9a55" stroke-width="1"/>
    <text x="26" y="31.5" text-anchor="middle" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#8a6b2e">6</text>
    <text x="48" y="33" font-family="Cormorant, Georgia, serif" font-size="22" font-weight="600" fill="#2c2536">Correct</text>
    <text x="20" y="60" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="10.5" fill="#5d5670">Cited, in the margin, out loud.</text>
    <text x="20" y="78" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#7a5ba6">manuscript_intent</text>
  </g>

  <g transform="translate(245 250)">
    <rect width="190" height="94" rx="16" fill="url(#lcCard)" stroke="#a98fce" stroke-width="1.25"/>
    <circle cx="26" cy="27" r="13" fill="#efe7f6" stroke="#a98fce" stroke-width="1"/>
    <text x="26" y="31.5" text-anchor="middle" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#553b78">7</text>
    <text x="48" y="33" font-family="Cormorant, Georgia, serif" font-size="22" font-weight="600" fill="#2c2536">Record</text>
    <text x="20" y="60" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="10.5" fill="#5d5670">Strong, shaky, missed, review.</text>
    <text x="20" y="78" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#7a5ba6">persisted turn outcome</text>
  </g>

  <g transform="translate(25 250)">
    <rect width="190" height="94" rx="16" fill="url(#lcCard)" stroke="#a98fce" stroke-width="1.25"/>
    <circle cx="26" cy="27" r="13" fill="#efe7f6" stroke="#a98fce" stroke-width="1"/>
    <text x="26" y="31.5" text-anchor="middle" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#553b78">8</text>
    <text x="48" y="33" font-family="Cormorant, Georgia, serif" font-size="22" font-weight="600" fill="#2c2536">Schedule</text>
    <text x="20" y="60" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="10.5" fill="#5d5670">The server persists the date.</text>
    <text x="20" y="78" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#7a5ba6">server_persisted_fsrs</text>
  </g>

  <text x="450" y="386" text-anchor="middle"
        font-family="'Hanken Grotesk', 'Avenir Next', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5d5670">
    One turn, one <tspan font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#7a5ba6">response_id</tspan>. Interrupting sends <tspan font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#7a5ba6">cancel</tspan>. Barge-in is a protocol frame, not a UI trick.
  </text>
</svg>
