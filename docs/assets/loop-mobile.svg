<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 610" width="440" height="610" role="img" aria-label="The Viva learner loop: upload materials, extract testable concepts, recall them out loud, get corrected against the source, mark mastery, and have weak concepts returned by spaced repetition">
  <title>The learner loop</title>
  <defs>
    <linearGradient id="cardFillM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfbf6"/>
      <stop offset="100%" stop-color="#faf7f1"/>
    </linearGradient>
    <g id="downArrowM">
      <path d="M -5.5 -6 L 0 6 L 5.5 -6 L 0 -3 Z" fill="#7a5ba6" opacity="0.8"/>
    </g>
  </defs>

  <rect width="440" height="610" fill="#f4efe6"/>

  <path d="M 88 485 H 54 Q 40 485 40 471 V 69 Q 40 55 54 55 H 76"
        fill="none" stroke="#7a5ba6" stroke-width="1.5"
        stroke-dasharray="2 9" stroke-linecap="round" opacity="0.5"/>
  <path d="M -6 -5.5 L 6 0 L -6 5.5 L -3 0 Z" transform="translate(84 55)" fill="#7a5ba6" opacity="0.85"/>

  <use href="#downArrowM" transform="translate(138 98)"/>
  <use href="#downArrowM" transform="translate(138 184)"/>
  <use href="#downArrowM" transform="translate(138 270)"/>
  <use href="#downArrowM" transform="translate(138 356)"/>
  <use href="#downArrowM" transform="translate(138 442)"/>

  <g transform="translate(88 24)">
    <rect width="300" height="62" rx="16" fill="url(#cardFillM)" stroke="#c3b2dd" stroke-width="1.25"/>
    <circle cx="50" cy="31" r="13" fill="#efe7f6" stroke="#a98fce" stroke-width="1"/>
    <text x="50" y="35.5" text-anchor="middle" font-family="'Hanken Grotesk', 'Avenir Next', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#553b78">1</text>
    <text x="76" y="27" font-family="Cormorant, Georgia, serif" font-size="22" font-weight="600" fill="#2c2536">Upload</text>
    <text x="76" y="44" font-family="'Hanken Grotesk', 'Avenir Next', Helvetica, Arial, sans-serif" font-size="10.5" fill="#5d5670">pasted or uploaded text</text>
  </g>

  <g transform="translate(88 110)">
    <rect width="300" height="62" rx="16" fill="url(#cardFillM)" stroke="#c3b2dd" stroke-width="1.25"/>
    <circle cx="50" cy="31" r="13" fill="#efe7f6" stroke="#a98fce" stroke-width="1"/>
    <text x="50" y="35.5" text-anchor="middle" font-family="'Hanken Grotesk', 'Avenir Next', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#553b78">2</text>
    <text x="76" y="27" font-family="Cormorant, Georgia, serif" font-size="22" font-weight="600" fill="#2c2536">Extract</text>
    <text x="76" y="44" font-family="'Hanken Grotesk', 'Avenir Next', Helvetica, Arial, sans-serif" font-size="10.5" fill="#5d5670">testable concepts</text>
  </g>

  <g transform="translate(88 196)">
    <rect width="300" height="62" rx="16" fill="url(#cardFillM)" stroke="#a98fce" stroke-width="1.5"/>
    <circle cx="50" cy="31" r="13" fill="#7a5ba6"/>
    <text x="50" y="35.5" text-anchor="middle" font-family="'Hanken Grotesk', 'Avenir Next', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#faf7f1">3</text>
    <text x="76" y="27" font-family="Cormorant, Georgia, serif" font-size="22" font-weight="600" fill="#2c2536">Recall</text>
    <text x="76" y="44" font-family="'Hanken Grotesk', 'Avenir Next', Helvetica, Arial, sans-serif" font-size="10.5" fill="#5d5670">out loud, from memory</text>
  </g>

  <g transform="translate(88 282)">
    <rect width="300" height="62" rx="16" fill="url(#cardFillM)" stroke="#c3b2dd" stroke-width="1.25"/>
    <circle cx="50" cy="31" r="13" fill="#f3ebd8" stroke="#bd9a55" stroke-width="1"/>
    <text x="50" y="35.5" text-anchor="middle" font-family="'Hanken Grotesk', 'Avenir Next', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a6b2e">4</text>
    <text x="76" y="27" font-family="Cormorant, Georgia, serif" font-size="22" font-weight="600" fill="#2c2536">Correct</text>
    <text x="76" y="44" font-family="'Hanken Grotesk', 'Avenir Next', Helvetica, Arial, sans-serif" font-size="10.5" fill="#5d5670">cited to the source</text>
  </g>

  <g transform="translate(88 368)">
    <rect width="300" height="62" rx="16" fill="url(#cardFillM)" stroke="#c3b2dd" stroke-width="1.25"/>
    <circle cx="50" cy="31" r="13" fill="#e9eee4" stroke="#7f9277" stroke-width="1"/>
    <text x="50" y="35.5" text-anchor="middle" font-family="'Hanken Grotesk', 'Avenir Next', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#4f6247">5</text>
    <text x="76" y="27" font-family="Cormorant, Georgia, serif" font-size="22" font-weight="600" fill="#2c2536">Master</text>
    <text x="76" y="44" font-family="'Hanken Grotesk', 'Avenir Next', Helvetica, Arial, sans-serif" font-size="10.5" fill="#5d5670">strong · shaky · missed</text>
  </g>

  <g transform="translate(88 454)">
    <rect width="300" height="62" rx="16" fill="url(#cardFillM)" stroke="#c3b2dd" stroke-width="1.25"/>
    <circle cx="50" cy="31" r="13" fill="#efe7f6" stroke="#a98fce" stroke-width="1"/>
    <text x="50" y="35.5" text-anchor="middle" font-family="'Hanken Grotesk', 'Avenir Next', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#553b78">6</text>
    <text x="76" y="27" font-family="Cormorant, Georgia, serif" font-size="22" font-weight="600" fill="#2c2536">Return</text>
    <text x="76" y="44" font-family="'Hanken Grotesk', 'Avenir Next', Helvetica, Arial, sans-serif" font-size="10.5" fill="#5d5670">the server schedules it</text>
  </g>

  <text x="220" y="573" text-anchor="middle"
        font-family="Cormorant, Georgia, serif" font-size="26" font-style="italic" fill="#553b78">“I can explain it.”</text>
</svg>
