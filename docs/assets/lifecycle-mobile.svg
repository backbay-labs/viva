<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 706" width="440" height="706" role="img" aria-label="Life of a study turn: the learner speaks, audio streams over the WebSocket, the agent transcribes, evaluates the answer, retrieves a grounding source, issues a correction, marks concept mastery, and schedules the review">
  <title>Life of a study turn</title>
  <defs>
    <linearGradient id="lcCardM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfbf6"/>
      <stop offset="100%" stop-color="#faf7f1"/>
    </linearGradient>
    <g id="lcDownM"><path d="M -5 -5 L 0 5 L 5 -5 L 0 -2.5 Z" fill="#7a5ba6" opacity="0.75"/></g>
  </defs>

  <rect width="440" height="706" fill="#f4efe6"/>

  <g font-family="'Hanken Grotesk', 'Avenir Next', Helvetica, Arial, sans-serif" font-size="10">
    <rect x="30" y="24" width="10" height="10" rx="3" fill="#e9eee4" stroke="#7f9277" stroke-width="1"/>
    <text x="46" y="33" fill="#5d5670">browser</text>
    <rect x="108" y="24" width="10" height="10" rx="3" fill="#efe7f6" stroke="#a98fce" stroke-width="1"/>
    <text x="124" y="33" fill="#5d5670">agent · Rust</text>
    <text x="410" y="33" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#938aa4">protocol v5</text>
  </g>

  <use href="#lcDownM" transform="translate(60 116)"/>
  <use href="#lcDownM" transform="translate(60 192)"/>
  <use href="#lcDownM" transform="translate(60 268)"/>
  <use href="#lcDownM" transform="translate(60 344)"/>
  <use href="#lcDownM" transform="translate(60 420)"/>
  <use href="#lcDownM" transform="translate(60 496)"/>
  <use href="#lcDownM" transform="translate(60 572)"/>

  <g transform="translate(30 52)">
    <rect width="380" height="64" rx="14" fill="url(#lcCardM)" stroke="#7f9277" stroke-width="1.25"/>
    <circle cx="26" cy="32" r="13" fill="#e9eee4" stroke="#7f9277" stroke-width="1"/>
    <text x="26" y="36.5" text-anchor="middle" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="12" font-weight="600" fill="#4f6247">1</text>
    <text x="50" y="30" font-family="Cormorant, Georgia, serif" font-size="21" font-weight="600" fill="#2c2536">Speak</text>
    <text x="50" y="48" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="10.5" fill="#5d5670">Close the notes. Answer from memory.</text>
  </g>

  <g transform="translate(30 128)">
    <rect width="380" height="64" rx="14" fill="url(#lcCardM)" stroke="#7f9277" stroke-width="1.25"/>
    <circle cx="26" cy="32" r="13" fill="#e9eee4" stroke="#7f9277" stroke-width="1"/>
    <text x="26" y="36.5" text-anchor="middle" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="12" font-weight="600" fill="#4f6247">2</text>
    <text x="50" y="30" font-family="Cormorant, Georgia, serif" font-size="21" font-weight="600" fill="#2c2536">Stream</text>
    <text x="50" y="48" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#7a5ba6">audio · text · cancel</text>
  </g>

  <g transform="translate(30 204)">
    <rect width="380" height="64" rx="14" fill="url(#lcCardM)" stroke="#a98fce" stroke-width="1.25"/>
    <circle cx="26" cy="32" r="13" fill="#efe7f6" stroke="#a98fce" stroke-width="1"/>
    <text x="26" y="36.5" text-anchor="middle" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="12" font-weight="600" fill="#553b78">3</text>
    <text x="50" y="30" font-family="Cormorant, Georgia, serif" font-size="21" font-weight="600" fill="#2c2536">Transcribe</text>
    <text x="50" y="48" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#7a5ba6">transcript_delta → transcript_final</text>
  </g>

  <g transform="translate(30 280)">
    <rect width="380" height="64" rx="14" fill="url(#lcCardM)" stroke="#a98fce" stroke-width="1.25"/>
    <circle cx="26" cy="32" r="13" fill="#efe7f6" stroke="#a98fce" stroke-width="1"/>
    <text x="26" y="36.5" text-anchor="middle" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="12" font-weight="600" fill="#553b78">4</text>
    <text x="50" y="30" font-family="Cormorant, Georgia, serif" font-size="21" font-weight="600" fill="#2c2536">Evaluate</text>
    <text x="50" y="48" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#7a5ba6">evaluate_spoken_answer</text>
  </g>

  <g transform="translate(30 356)">
    <rect width="380" height="64" rx="14" fill="url(#lcCardM)" stroke="#a98fce" stroke-width="1.25"/>
    <circle cx="26" cy="32" r="13" fill="#efe7f6" stroke="#a98fce" stroke-width="1"/>
    <text x="26" y="36.5" text-anchor="middle" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="12" font-weight="600" fill="#553b78">5</text>
    <text x="50" y="30" font-family="Cormorant, Georgia, serif" font-size="21" font-weight="600" fill="#2c2536">Ground</text>
    <text x="50" y="48" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#7a5ba6">retrieve_source_reference</text>
  </g>

  <g transform="translate(30 432)">
    <rect width="380" height="64" rx="14" fill="url(#lcCardM)" stroke="#bd9a55" stroke-width="1.5"/>
    <circle cx="26" cy="32" r="13" fill="#f3ebd8" stroke="#bd9a55" stroke-width="1"/>
    <text x="26" y="36.5" text-anchor="middle" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="12" font-weight="600" fill="#8a6b2e">6</text>
    <text x="50" y="30" font-family="Cormorant, Georgia, serif" font-size="21" font-weight="600" fill="#2c2536">Correct</text>
    <text x="50" y="48" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#7a5ba6">manuscript_intent</text>
  </g>

  <g transform="translate(30 508)">
    <rect width="380" height="64" rx="14" fill="url(#lcCardM)" stroke="#a98fce" stroke-width="1.25"/>
    <circle cx="26" cy="32" r="13" fill="#efe7f6" stroke="#a98fce" stroke-width="1"/>
    <text x="26" y="36.5" text-anchor="middle" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="12" font-weight="600" fill="#553b78">7</text>
    <text x="50" y="30" font-family="Cormorant, Georgia, serif" font-size="21" font-weight="600" fill="#2c2536">Record</text>
    <text x="50" y="48" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#7a5ba6">persisted turn outcome</text>
  </g>

  <g transform="translate(30 584)">
    <rect width="380" height="64" rx="14" fill="url(#lcCardM)" stroke="#a98fce" stroke-width="1.25"/>
    <circle cx="26" cy="32" r="13" fill="#efe7f6" stroke="#a98fce" stroke-width="1"/>
    <text x="26" y="36.5" text-anchor="middle" font-family="'Hanken Grotesk', Helvetica, sans-serif" font-size="12" font-weight="600" fill="#553b78">8</text>
    <text x="50" y="30" font-family="Cormorant, Georgia, serif" font-size="21" font-weight="600" fill="#2c2536">Schedule</text>
    <text x="50" y="48" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#7a5ba6">server_persisted_fsrs → recap_ready</text>
  </g>

  <text x="220" y="678" text-anchor="middle"
        font-family="'Hanken Grotesk', 'Avenir Next', Helvetica, Arial, sans-serif" font-size="10.5" fill="#5d5670">
    One turn, one <tspan font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#7a5ba6">response_id</tspan>. Barge-in is a protocol frame.
  </text>
</svg>
