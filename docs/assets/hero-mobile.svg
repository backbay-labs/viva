<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260" role="img" aria-label="Viva: study by talking">
  <title>Viva</title>
  <defs>
    <radialGradient id="orbM" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#c3b2dd"/>
      <stop offset="45%" stop-color="#a98fce"/>
      <stop offset="100%" stop-color="#7a5ba6"/>
    </radialGradient>
    <radialGradient id="haloM" cx="50%" cy="50%" r="50%">
