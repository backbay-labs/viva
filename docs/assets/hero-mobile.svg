  <rect width="440" height="260" fill="url(#vignetteM)"/>

  <g clip-path="url(#frameM)" fill="none" stroke="#7a5ba6" stroke-width="1">
    <circle cx="220" cy="80" r="62"  opacity="0.16"/>
    <circle cx="220" cy="80" r="96"  opacity="0.11"/>
    <circle cx="220" cy="80" r="136" opacity="0.075"/>
    <circle cx="220" cy="80" r="182" opacity="0.045"/>
  </g>

  <circle cx="220" cy="80" r="48" fill="url(#haloM)"/>
  <circle cx="220" cy="80" r="20" fill="url(#orbM)"/>
  <circle cx="220" cy="80" r="20" fill="none" stroke="#553b78" stroke-width="0.75" opacity="0.35"/>
  <ellipse cx="213.5" cy="73.5" rx="6.5" ry="4.8" fill="#fdfbf6" opacity="0.42"/>

  <text x="220" y="184" text-anchor="middle"
